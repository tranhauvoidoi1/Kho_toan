<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho Bài Toán Hay - Siêu Tốc & Tối Ưu</title>
  
  <!-- KaTeX CSS & JS (Thư viện Render Toán Học Siêu Nhanh) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
          }
        }
      }
    }
  </script>

  <style>
    /* CSS Content Visibility giúp tăng tốc cuộn trang gấp 5 lần */
    .math-card {
      content-visibility: auto;
      contain-intrinsic-size: 1px 250px;
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 custom-scrollbar">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-brand-600 text-white p-2 rounded-xl font-black text-xl shadow-md">∑</div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent hidden sm:block">
          Kho Bài Toán Hay
        </h1>
      </div>

      <!-- Controls & Actions -->
      <div class="flex items-center gap-2">
        <button onclick="toggleModal(true)" class="bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all shadow-sm flex items-center gap-2 active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Thêm Bài Toán
        </button>

        <button onclick="exportData()" title="Xuất dữ liệu JSON" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        </button>

        <label title="Nhập dữ liệu JSON" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors cursor-pointer">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <input type="file" accept=".json" onchange="importData(event)" class="hidden" />
        </label>

        <button onclick="toggleDarkMode()" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- Filter & Search Bar -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
      <div class="relative w-full md:w-96">
        <input type="text" id="searchInput" oninput="debouncedFilter()" placeholder="Tìm kiếm đề bài, công thức LaTeX..." 
               class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm" />
        <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
        <select id="filterGrade" onchange="filterProblems()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
          <option value="">Tất cả Khối lớp</option>
          <option value="6">Lớp 6</option><option value="7">Lớp 7</option>
          <option value="8">Lớp 8</option><option value="9">Lớp 9</option>
          <option value="10">Lớp 10</option><option value="11">Lớp 11</option><option value="12">Lớp 12</option>
        </select>

        <select id="filterCategory" onchange="filterProblems()" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
          <option value="">Tất cả Phân môn</option>
          <option value="Đại số">Đại số</option>
          <option value="Hình học">Hình học</option>
          <option value="Giải tích">Giải tích</option>
          <option value="Tổ hợp - Xắc suất">Tổ hợp - Xác suất</option>
        </select>

        <button onclick="toggleBookmarkFilter()" id="btnBookmarkFilter" class="px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 whitespace-nowrap">
          ★ Đã đánh dấu
        </button>
      </div>
    </div>

    <!-- Problems List Container -->
    <div id="problemsList" class="grid grid-cols-1 gap-6">
      <!-- Dynamic Problem Cards -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="text-5xl mb-3">📐</div>
      <h3 class="text-lg font-semibold text-slate-600 dark:text-slate-400">Chưa có bài toán nào phù hợp</h3>
      <p class="text-sm text-slate-400 mt-1">Hãy thử thêm bài toán mới hoặc thay đổi bộ lọc tìm kiếm.</p>
    </div>
  </main>

  <!-- Modal Form: Thêm/Sửa bài toán -->
  <div id="problemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-4xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
        <h2 id="modalTitle" class="text-lg font-bold">Thêm Bài Toán Mới</h2>
        <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
      </div>

      <!-- Modal Body -->
      <div class="p-6 overflow-y-auto custom-scrollbar flex-1 grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Form Inputs -->
        <form id="problemForm" class="space-y-4">
          <input type="hidden" id="editId" />
          
          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tiêu đề bài toán</label>
            <input type="text" id="inputTitle" required placeholder="Ví dụ: Cực trị hàm số chứa dấu giá trị tuyệt đối" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Khối lớp</label>
              <select id="inputGrade" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
                <option value="12">Lớp 12</option><option value="11">Lớp 11</option><option value="10">Lớp 10</option>
                <option value="9">Lớp 9</option><option value="8">Lớp 8</option><option value="7">Lớp 7</option><option value="6">Lớp 6</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Phân môn</label>
              <select id="inputCategory" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm">
                <option value="Đại số">Đại số</option><option value="Giải tích">Giải tích</option>
                <option value="Hình học">Hình học</option><option value="Tổ hợp - Xác suất">Tổ hợp - Xác suất</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Đề bài (Hỗ trợ $LaTeX$)</label>
            <textarea id="inputQuestion" rows="4" required oninput="debouncedModalPreview()" placeholder="Cho hàm số $y = f(x)$ liên tục trên $\mathbb{R}$..." class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-mono"></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Hình ảnh đính kèm (Tự động nén siêu nhẹ)</label>
            <input type="file" id="inputImage" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 cursor-pointer" />
            <div id="imagePreviewContainer" class="mt-2 relative hidden">
              <img id="imgPreview" class="max-h-32 rounded-lg border border-slate-200" />
              <button type="button" onclick="removeImage()" class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs">✕</button>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Lời giải chi tiết (Hỗ trợ $LaTeX$)</label>
            <textarea id="inputSolution" rows="5" oninput="debouncedModalPreview()" placeholder="Lời giải:\nTa có $f'(x) = 0 \Leftrightarrow ...$" class="w-full p-3 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-sm focus:ring-2 focus:ring-brand-500 outline-none font-mono"></textarea>
          </div>
        </form>

        <!-- Live Preview Pane -->
        <div class="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 flex flex-col">
          <span class="text-xs font-bold uppercase text-brand-600 mb-2">Xem trước kết quả (Live Preview)</span>
          <div class="flex-1 overflow-y-auto space-y-3 custom-scrollbar text-sm">
            <div id="previewTitle" class="font-bold text-base text-brand-700 dark:text-brand-400"></div>
            <div id="previewQuestion" class="prose dark:prose-invert"></div>
            <img id="previewImage" class="max-h-48 rounded-lg mx-auto hidden" />
            <div id="previewSolution" class="mt-3 p-3 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 text-xs font-mono"></div>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex justify-end gap-3">
        <button onclick="toggleModal(false)" class="px-4 py-2 text-sm rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">Hủy</button>
        <button onclick="saveProblem()" class="px-5 py-2 text-sm rounded-lg bg-brand-600 text-white font-medium hover:bg-brand-700 active:scale-95 transition-all">Lưu bài toán</button>
      </div>

    </div>
  </div>

  <script>
    // System State
    let problems = JSON.parse(localStorage.getItem('math_problems') || '[]');
    let currentImageBase64 = '';
    let filterBookmarkedOnly = false;
    let observer = null;

    // Debounce Utility (Tránh lag khi gõ)
    function debounce(func, wait = 300) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    const debouncedFilter = debounce(() => filterProblems(), 250);
    const debouncedModalPreview = debounce(() => updateModalPreview(), 200);

    // Initial Launch
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initLazyObserver();
      if (problems.length === 0) loadSampleData();
      renderProblems(problems);
    });

    // Lazy KaTeX Rendering Observer (Tối ưu cuộn trang)
    function initLazyObserver() {
      observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const card = entry.target;
            if (!card.dataset.rendered) {
              renderKaTeXInElement(card);
              card.dataset.rendered = "true";
            }
          }
        });
      }, { rootMargin: '100px' });
    }

    function renderKaTeXInElement(elem) {
      if (window.renderMathInElement) {
        renderMathInElement(elem, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    // Render List Problems (Siêu Nhanh)
    function renderProblems(list) {
      const container = document.getElementById('problemsList');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      if (list.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      const fragment = document.createDocumentFragment();

      list.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = "math-card bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm transition-all hover:shadow-md";
        
        card.innerHTML = `
          <div class="flex items-start justify-between gap-4 border-b border-slate-100 dark:border-slate-700/50 pb-3 mb-3">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300 font-semibold text-xs px-2.5 py-1 rounded-md">Lớp ${p.grade}</span>
              <span class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs px-2.5 py-1 rounded-md">${p.category}</span>
              <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base ml-1">${escapeHtml(p.title)}</h3>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="toggleBookmark('${p.id}')" class="text-lg hover:scale-110 transition-transform">
                ${p.bookmarked ? '★' : '☆'}
              </button>
              <button onclick="editProblem('${p.id}')" class="text-xs text-slate-400 hover:text-brand-600 px-2 py-1">Sửa</button>
              <button onclick="deleteProblem('${p.id}')" class="text-xs text-slate-400 hover:text-red-600 px-2 py-1">Xóa</button>
            </div>
          </div>

          <div class="text-sm text-slate-700 dark:text-slate-200 mb-3 whitespace-pre-line leading-relaxed">${escapeHtml(p.question)}</div>

          ${p.image ? `<div class="my-3"><img src="${p.image}" loading="lazy" class="max-h-64 rounded-lg border border-slate-200 dark:border-slate-700 mx-auto" /></div>` : ''}

          ${p.solution ? `
            <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700/50">
              <button onclick="toggleSolution('${p.id}')" class="text-xs font-semibold text-brand-600 dark:text-brand-400 flex items-center gap-1 hover:underline">
                <span id="solArrow-${p.id}">▶</span> Lời giải chi tiết
              </button>
              <div id="solBox-${p.id}" class="hidden mt-3 p-4 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-200/80 dark:border-slate-700/80 text-sm whitespace-pre-line">
                ${escapeHtml(p.solution)}
              </div>
            </div>
          ` : ''}
        `;

        fragment.appendChild(card);
        observer.observe(card);
      });

      container.appendChild(fragment);
    }

    // Modal Live Preview
    function updateModalPreview() {
      document.getElementById('previewTitle').innerText = document.getElementById('inputTitle').value || 'Tiêu đề bài toán';
      
      const qElem = document.getElementById('previewQuestion');
      qElem.innerText = document.getElementById('inputQuestion').value || 'Nội dung đề bài...';
      renderKaTeXInElement(qElem);

      const solElem = document.getElementById('previewSolution');
      solElem.innerText = document.getElementById('inputSolution').value || 'Lời giải chi tiết...';
      renderKaTeXInElement(solElem);

      const imgElem = document.getElementById('previewImage');
      if (currentImageBase64) {
        imgElem.src = currentImageBase64;
        imgElem.classList.remove('hidden');
      } else {
        imgElem.classList.add('hidden');
      }
    }

    // Tự động nén ảnh qua Canvas (Siêu tối ưu LocalStorage)
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 800;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Nén chất lượng 0.75
          currentImageBase64 = canvas.toDataURL('image/jpeg', 0.75);
          
          document.getElementById('imgPreview').src = currentImageBase64;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
          debouncedModalPreview();
        }
        img.src = event.target.result;
      }
      reader.readAsDataURL(file);
    }

    function removeImage() {
      currentImageBase64 = '';
      document.getElementById('inputImage').value = '';
      document.getElementById('imagePreviewContainer').classList.add('hidden');
      debouncedModalPreview();
    }

    // Save/Add Problem
    function saveProblem() {
      const title = document.getElementById('inputTitle').value.trim();
      const question = document.getElementById('inputQuestion').value.trim();
      if (!title || !question) {
        alert('Vui lòng nhập đầy đủ tiêu đề và đề bài!');
        return;
      }

      const id = document.getElementById('editId').value || Date.now().toString();
      const grade = document.getElementById('inputGrade').value;
      const category = document.getElementById('inputCategory').value;
      const solution = document.getElementById('inputSolution').value.trim();

      const index = problems.findIndex(p => p.id === id);
      const problemData = { id, title, grade, category, question, solution, image: currentImageBase64, bookmarked: index !== -1 ? problems[index].bookmarked : false };

      if (index !== -1) {
        problems[index] = problemData;
      } else {
        problems.unshift(problemData);
      }

      saveToStorage();
      filterProblems();
      toggleModal(false);
    }

    // Controls & Operations
    function toggleSolution(id) {
      const box = document.getElementById(`solBox-${id}`);
      const arrow = document.getElementById(`solArrow-${id}`);
      if (box.classList.contains('hidden')) {
        box.classList.remove('hidden');
        arrow.innerText = '▼';
        renderKaTeXInElement(box);
      } else {
        box.classList.add('hidden');
        arrow.innerText = '▶';
      }
    }

    function toggleBookmark(id) {
      const p = problems.find(item => item.id === id);
      if (p) {
        p.bookmarked = !p.bookmarked;
        saveToStorage();
        filterProblems();
      }
    }

    function deleteProblem(id) {
      if (confirm('Bạn có chắc chắn muốn xóa bài toán này?')) {
        problems = problems.filter(p => p.id !== id);
        saveToStorage();
        filterProblems();
      }
    }

    function editProblem(id) {
      const p = problems.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editId').value = p.id;
      document.getElementById('inputTitle').value = p.title;
      document.getElementById('inputGrade').value = p.grade;
      document.getElementById('inputCategory').value = p.category;
      document.getElementById('inputQuestion').value = p.question;
      document.getElementById('inputSolution').value = p.solution || '';
      currentImageBase64 = p.image || '';

      if (currentImageBase64) {
        document.getElementById('imgPreview').src = currentImageBase64;
        document.getElementById('imagePreviewContainer').classList.remove('hidden');
      } else {
        document.getElementById('imagePreviewContainer').classList.add('hidden');
      }

      document.getElementById('modalTitle').innerText = 'Sửa Bài Toán';
      toggleModal(true);
      debouncedModalPreview();
    }

    // Filters
    function filterProblems() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const grade = document.getElementById('filterGrade').value;
      const cat = document.getElementById('filterCategory').value;

      const filtered = problems.filter(p => {
        const matchSearch = p.title.toLowerCase().includes(search) || p.question.toLowerCase().includes(search);
        const matchGrade = !grade || p.grade === grade;
        const matchCat = !cat || p.category === cat;
        const matchBookmark = !filterBookmarkedOnly || p.bookmarked;
        return matchSearch && matchGrade && matchCat && matchBookmark;
      });

      renderProblems(filtered);
    }

    function toggleBookmarkFilter() {
      filterBookmarkedOnly = !filterBookmarkedOnly;
      const btn = document.getElementById('btnBookmarkFilter');
      if (filterBookmarkedOnly) {
        btn.classList.add('bg-amber-500', 'text-white', 'border-amber-500');
      } else {
        btn.classList.remove('bg-amber-500', 'text-white', 'border-amber-500');
      }
      filterProblems();
    }

    // Storage & Export/Import
    function saveToStorage() {
      localStorage.setItem('math_problems', JSON.stringify(problems));
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(problems, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `kho_bai_toan_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            problems = imported;
            saveToStorage();
            filterProblems();
            alert('Nhập dữ liệu bài toán thành công!');
          }
        } catch (err) {
          alert('File JSON không hợp lệ!');
        }
      };
      reader.readAsText(file);
    }

    // Modal Helpers
    function toggleModal(show) {
      const modal = document.getElementById('problemModal');
      if (show) {
        modal.classList.remove('hidden');
        if (!document.getElementById('editId').value) {
          document.getElementById('problemForm').reset();
          removeImage();
          document.getElementById('modalTitle').innerText = 'Thêm Bài Toán Mới';
        }
        debouncedModalPreview();
      } else {
        modal.classList.add('hidden');
        document.getElementById('editId').value = '';
      }
    }
